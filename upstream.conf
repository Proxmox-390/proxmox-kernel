# The upstream source this packaging builds from: Proxmox's kernel repository (a
# kernel.org stable tree plus Proxmox's debian/ packaging) at a release tag.
# Read by make and by the shell scripts: plain NAME=value lines only.
#
# UPSTREAM_COMMIT is the commit the tag must point to; the fetch is refused if
# it does not. UPSTREAM_ZFS_COMMIT is the commit of the debian/zfsonlinux
# submodule recorded in that tree.
UPSTREAM_URL=https://git.proxmox.com/git/proxmox-kernel.git
UPSTREAM_TAG=proxmox/7.3.6-1
UPSTREAM_COMMIT=3863272a840d85dd23505549fdb7253303b709d8
UPSTREAM_ZFS_COMMIT=7970b7192632d00c8543020a59c22d0ae3937bef
